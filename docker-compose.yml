version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ai-code-judge-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-code-judge-backend
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/ai-code-judge?authSource=admin
      JWT_SECRET: supersecretjwtkey
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-code-judge-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
